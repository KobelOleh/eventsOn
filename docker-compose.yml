name: eventson

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventson
      POSTGRES_PASSWORD: eventson
      POSTGRES_DB: eventson
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventson -d eventson"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
